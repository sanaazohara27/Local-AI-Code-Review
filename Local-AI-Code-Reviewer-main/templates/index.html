<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Code Reviewer</title>
  <link rel="stylesheet" href="/static/css/style.css"/>
</head>
<body>

<!-- ── HEADER ─────────────────────────────────────────── -->
<header class="header">
  <div class="header-left">
    <div class="logo">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="16 18 22 12 16 6"/>
        <polyline points="8 6 2 12 8 18"/>
      </svg>
      Code Reviewer
    </div>
  </div>
  <div class="header-right">
    <div class="status-pill" id="statusPill">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Checking...</span>
    </div>
  </div>
</header>

<!-- ── MAIN ───────────────────────────────────────────── -->
<main class="main">

  <!-- LEFT PANEL: Input -->
  <section class="panel panel-left">

    <div class="panel-header">
      <span class="panel-title">Submit Code</span>
      <div class="lang-select-wrap">
        <select id="langSelect" class="lang-select">
          <option value="auto">Auto detect</option>
          <option value="python">Python</option>
          <option value="javascript">JavaScript</option>
          <option value="java">Java</option>
          <option value="cpp">C++</option>
          <option value="c">C</option>
          <option value="typescript">TypeScript</option>
          <option value="go">Go</option>
          <option value="rust">Rust</option>
          <option value="php">PHP</option>
          <option value="ruby">Ruby</option>
          <option value="sql">SQL</option>
        </select>
      </div>
    </div>

    <textarea
      id="codeInput"
      class="code-area"
      placeholder="Paste your code here..."
      spellcheck="false"
    ></textarea>

    <div class="input-footer">
      <div class="file-upload-wrap">
        <label class="file-btn" for="fileInput">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          Upload file
        </label>
        <input type="file" id="fileInput" accept=".py,.js,.ts,.java,.cpp,.c,.go,.rs,.php,.rb,.sql,.txt" hidden/>
        <span class="file-name" id="fileName"></span>
      </div>
      <button class="review-btn" id="reviewBtn" onclick="submitReview()">
        Review
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="5" y1="12" x2="19" y2="12"/>
          <polyline points="12 5 19 12 12 19"/>
        </svg>
      </button>
    </div>

  </section>

  <!-- RIGHT PANEL: Output -->
  <section class="panel panel-right">

    <div class="panel-header">
      <span class="panel-title" id="reviewTitle">Review</span>
      <div class="panel-actions" id="panelActions" style="display:none">
        <button class="icon-btn" onclick="copyReview()" title="Copy review">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
        </button>
        <button class="icon-btn" onclick="clearAll()" title="Clear">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
            <path d="M10 11v6M14 11v6"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Empty state -->
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </div>
      <p class="empty-title">No review yet</p>
      <p class="empty-sub">Paste code on the left and click Review</p>
    </div>

    <!-- Loading state -->
    <div class="loading-state" id="loadingState" style="display:none">
      <div class="spinner"></div>
      <p class="loading-text">Reviewing with <strong>{{ model }}</strong></p>
      <p class="loading-sub">Running locally — this may take 15–30 seconds</p>
    </div>

    <!-- Review output -->
    <div class="review-output" id="reviewOutput" style="display:none"></div>

    <!-- Chat section -->
    <div class="chat-section" id="chatSection" style="display:none">
      <div class="chat-divider">
        <span>Follow-up questions</span>
      </div>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-input-row">
        <input
          type="text"
          id="chatInput"
          class="chat-input"
          placeholder="Ask about this code..."
          onkeydown="if(event.key==='Enter') sendChat()"
        />
        <button class="chat-send-btn" onclick="sendChat()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
    </div>

  </section>

</main>

<!-- ── WEBHOOK INFO BANNER ────────────────────────────── -->
<div class="webhook-banner" id="webhookBanner">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <circle cx="12" cy="12" r="10"/>
    <line x1="12" y1="8" x2="12" y2="12"/>
    <line x1="12" y1="16" x2="12.01" y2="16"/>
  </svg>
  GitHub webhook active — pull requests on connected repositories will be reviewed automatically.
  <button class="banner-close" onclick="document.getElementById('webhookBanner').style.display='none'">×</button>
</div>

<script src="/static/js/main.js"></script>
</body>
</html>
